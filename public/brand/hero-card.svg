<svg width="524" height="524" viewBox="0 0 524 524" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isometric payment/statement card  Basis Theory style, Siscom accent -->
  <g transform="translate(262 270)">
    <!-- Card body with isometric skew -->
    <g transform="rotate(-22) skewX(-18) scale(1.05, 0.92)">
      <rect x="-150" y="-95" width="300" height="190" rx="28" fill="#B8B8BE"/>
      <rect x="-150" y="-95" width="300" height="190" rx="28" fill="url(#cardGrad)" opacity="0.35"/>
      <!-- Chip plate -->
      <rect x="-58" y="-48" width="116" height="116" rx="22" fill="#18181B"/>
      <!-- Corner rivets -->
      <circle cx="-42" cy="-32" r="4" fill="#3F3F46"/>
      <circle cx="42" cy="-32" r="4" fill="#3F3F46"/>
      <circle cx="-42" cy="52" r="4" fill="#3F3F46"/>
      <circle cx="42" cy="52" r="4" fill="#3F3F46"/>
      <!-- Siscom pink mark -->
      <g transform="translate(0 10)">
        <rect x="-28" y="-28" width="22" height="22" rx="5" fill="#EB1260"/>
        <path d="M-2 -28 H18 A5 5 0 0 1 23 -23 V10 H2 A5 5 0 0 1 -3 5 Z" fill="#EB1260"/>
        <path d="M-28 -2 H-3 V28 H-23 A5 5 0 0 1 -28 23 Z" fill="#CA3060"/>
      </g>
    </g>
  </g>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#71717A" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

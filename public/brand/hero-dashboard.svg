<svg width="524" height="524" viewBox="0 0 524 524" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isometric dashboard wireframe  Basis Theory style -->
  <g transform="translate(262 280) scale(1.05) rotate(-18) skewX(-12)">
    <!-- Main shell -->
    <rect x="-170" y="-130" width="340" height="250" rx="28" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="2.5"/>
    <!-- Sidebar -->
    <rect x="-155" y="-115" width="70" height="220" rx="16" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <!-- Sidebar icons + bars -->
    <g stroke="#71717A" stroke-width="2" fill="none">
      <circle cx="-132" cy="-85" r="7"/>
      <line x1="-118" y1="-85" x2="-95" y2="-85"/>
      <circle cx="-132" cy="-55" r="7"/>
      <line x1="-118" y1="-55" x2="-95" y2="-55"/>
      <circle cx="-132" cy="-25" r="7"/>
      <line x1="-118" y1="-25" x2="-95" y2="-25"/>
      <circle cx="-132" cy="5" r="7"/>
      <line x1="-118" y1="5" x2="-95" y2="5"/>
      <circle cx="-132" cy="35" r="7"/>
      <line x1="-118" y1="35" x2="-95" y2="35"/>
      <circle cx="-132" cy="65" r="7"/>
      <line x1="-118" y1="65" x2="-95" y2="65"/>
    </g>
    <!-- Top bar -->
    <rect x="-75" y="-115" width="240" height="36" rx="12" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <circle cx="-55" cy="-97" r="5" fill="#D4D4D8"/>
    <circle cx="-38" cy="-97" r="5" fill="#D4D4D8"/>
    <circle cx="-21" cy="-97" r="5" fill="#D4D4D8"/>
    <rect x="-5" y="-105" width="42" height="16" rx="8" fill="none" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="45" y="-105" width="42" height="16" rx="8" fill="none" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="95" y="-105" width="42" height="16" rx="8" fill="none" stroke="#A1A1AA" stroke-width="2"/>
    <circle cx="150" cy="-97" r="8" fill="none" stroke="#A1A1AA" stroke-width="2"/>
    <!-- Content cards -->
    <rect x="-75" y="-68" width="145" height="95" rx="16" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <!-- Hatch pattern panel -->
    <defs>
      <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#C4C4C8" stroke-width="1.5"/>
      </pattern>
    </defs>
    <rect x="-62" y="-52" width="119" height="63" rx="10" fill="url(#hatch)" stroke="#A1A1AA" stroke-width="1.5"/>
    <rect x="80" y="-68" width="85" height="42" rx="12" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="80" y="-18" width="85" height="42" rx="12" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="-75" y="40" width="110" height="48" rx="14" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="45" y="40" width="70" height="48" rx="14" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="125" y="48" width="40" height="32" rx="16" fill="#18181B"/>
  </g>
</svg>
